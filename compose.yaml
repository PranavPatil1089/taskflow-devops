services:

  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - taskflow-mongo-data:/data/db

  backend:
    image: taskflow-backend:v1
    container_name: taskflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/taskflow
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_EXPIRES_IN: 7d
    depends_on:
      - mongodb

  frontend:
    image: taskflow-frontend:v1
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  taskflow-mongo-data:
    external: true