name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets prepare-release.yml start CI on release PRs (PRs opened by a workflow don't trigger it)
  workflow_dispatch:

# Default permissions for jobs; Docker publishing permissions are defined separately
permissions:
  contents: read

# A new push to the same branch cancels the run that's still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm run lint --prefix server
      # The release and merge scripts in .github/scripts are linted with the server's config
      - run: npm run lint:scripts
      - run: npm test

  build:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run lint --prefix client
      - run: npm run build
        env:
          # Placeholder; the build only needs the variable to be set
          VITE_API_URL: http://localhost:5000/api/v1
  docker:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          load: true
          tags: |
            ghcr.io/pranavpatil1089/taskflow-backend:latest
            ghcr.io/pranavpatil1089/taskflow-backend:${{ github.sha }}
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          load: true
          build-args: |
            VITE_API_URL=http://localhost:5000/api/v1
          tags: |
            ghcr.io/pranavpatil1089/taskflow-frontend:latest
            ghcr.io/pranavpatil1089/taskflow-frontend:${{ github.sha }}

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/pranavpatil1089/taskflow-backend:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/pranavpatil1089/taskflow-frontend:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push backend image to GHCR
        run: |
          docker push ghcr.io/pranavpatil1089/taskflow-backend:latest
          docker push ghcr.io/pranavpatil1089/taskflow-backend:${{ github.sha }}

      - name: Push frontend image to GHCR
        run: |
          docker push ghcr.io/pranavpatil1089/taskflow-frontend:latest
          docker push ghcr.io/pranavpatil1089/taskflow-frontend:${{ github.sha }}